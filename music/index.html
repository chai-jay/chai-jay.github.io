<!doctype html>
<html>
<head>
    <title>Music - Chai's Github.io</title>
    <style type="text/css">
        h1 {
            margin: 0.2em 0;
        }

        h2 {
            margin: 0.1em 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
        }

        .loading_indicator {
            width: 250px;
            height: 250px;
        }

        .loading_indicator_icon {
            margin: 50px;
            animation: spin-animation 1.5s infinite;
            animation-timing-function: linear;
        }

        @keyframes spin-animation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(359deg);
            }
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h1>Songs</h1>
<div class="container">
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/7pdporTfXFz4iYHvNmSHTu?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>
</body>
</html>
